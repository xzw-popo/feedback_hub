# =============================================================================
# tagger/rules.yaml —— 一审规则数据（关键词 / 正则 / 阈值 / 置信度）
# -----------------------------------------------------------------------------
# 维护原则：
#   1) 这里只放「数据」。判定顺序、长度分支、提级条件等「逻辑」仍写在 rules.py。
#   2) 高置信、低假阳性。模糊样本不要硬塞进来，让 LLM 兜底。
#   3) 修改后无需改代码，重启进程即可生效（启动期会做正则编译校验，写错会立即报错）。
#
# YAML 写正则注意事项：
#   - 含 ? * \ [ : 等特殊字符的模式，统一用「双引号包裹」，反斜杠写两次（如 "^\\?+$"）。
#   - 没有特殊字符的，直接写裸字符串即可（如  闪退）。
# =============================================================================


# -----------------------------------------------------------------------------
# 一、L2 维度关键词
#     用途：在 L1 已确定时，附加 L2 标签（多选；命中 0 个时由代码回退到 ["其他"]）。
#     形式：每个 L2 标签对应一组「子串关键词」，命中即附加该 L2 标签。
# -----------------------------------------------------------------------------
l2_keywords:
  输入核心:
    - 打字
    - 输入
    - 联想
    - 候选
    - 首选
    - 上屏
    - 拼音
    - 九键
    - 全键
    - 翻页
    - 选词
    - 纠错
    - 笔画
    - 双拼
    - 云联想
  语音:
    - 语音
    - 录音
    - 听写
    - 麦克风
    - 语音识别
    - 语音转文字
  符号表情:
    - 表情
    - emoji
    - 符号
    - 颜文字
    - 斗图
    - 贴纸
    - gif
  皮肤:
    - 皮肤
    - 主题
    - 壁纸
    - 键盘背景
    - 字体
    - 配色
  词库:
    - 词库
    - 热词
    - 造词
    - 自定义短语
    - 短语
    - 用户词
    - 同步词
  账号:
    - 登录
    - 登陆
    - 账号
    - 微信登录
    - 退出登录
    - 同步
    - 云同步
  键盘交互:
    - 键盘
    - 高度
    - 布局
    - 悬浮
    - 分屏
    - 震动
    - 按键音
    - 光标
    - 手写
  安装更新:
    - 安装
    - 更新
    - 升级
    - 下载
    - 无法安装
    - 新版本
  性能:
    - 卡顿
    - 卡死
    - 卡
    - 慢
    - 耗电
    - 发烫
    - 占用
    - 内存
    - fps
  权限隐私:
    - 权限
    - 隐私
    - 授权
    - 麦克风权限
    - 通知
    - 悬浮窗
    - 无障碍
  广告活动:
    - 广告
    - 弹窗
    - 推广
    - 活动
    - 运营
    - 推送


# -----------------------------------------------------------------------------
# 二、L1 维度正则模式
# -----------------------------------------------------------------------------

# A.Bug —— P0 级（功能完全不可用）
p0_patterns:
  - 闪退
  - 崩溃
  - crash
  - 打不开
  - 无法启动
  - 启动不了
  - 用不了
  - 无法使用
  - 完全不能用
  - 完全用不了
  - 白屏
  - 黑屏
  - 无法输入
  - 输入不了
  - 打不出字
  - 敲不了字

# A.Bug —— P1/P2 级（明显异常但非完全不可用；P1/P2 由 bug_uplift_pattern 决定）
bug_patterns:
  - 卡死
  - 卡住
  - 卡顿
  - 发烫
  - 耗电
  - 掉电
  - 乱码
  - 丢失
  - 丢字
  - 漏字
  - 错位
  - 错乱
  - bug
  - BUG
  - 故障
  - 异常
  - 失灵
  - 失效
  - 不显示
  - 看不到
  - 消失了
  - 找不到
  - 显示不全
  - 重启
  - 自动退出
  - 反应慢
  - 延迟

# B.建议
suggest_patterns:
  - 建议
  - 希望
  - 期望
  - 能否
  - 可否
  - 能不能
  - 可不可以
  - 可以加
  - 可以增加
  - 求加
  - 求增加
  - 应该有
  - 为什么没有
  - 为啥没有
  - 什么时候有
  - "要是.*就好了"
  - "如果.*就好了"
  - "最好.*能"
  - 求支持
  - 求适配
  - 求优化

# C.咨询
question_patterns:
  - 怎么
  - 如何
  - 咋
  - 怎样
  - 什么是
  - 是啥
  - 在哪
  - 哪里
  - 哪儿
  - 为什么
  - 为啥
  - 求助
  - 请问
  - 咨询
  - "教.*一下"

# D.情绪 —— 纯赞美 / 纯吐槽，无功能描述
emotion_pos_patterns:
  - "^好用$"
  - "^很好用$"
  - "^超好用$"
  - "^太好用了$"
  - "^赞$"
  - "^棒$"
  - "^喜欢$"
  - "^爱了$"
  - "^yyds$"
  - "^nb$"
  - "^点赞$"
  - "^顶$"

emotion_neg_patterns:
  - "^垃圾$"
  - "^难用$"
  - "^太难用了$"
  - "^差评$"
  - "^烂$"
  - "^辣鸡$"
  - "^垃圾输入法$"

# E.无效 —— 测试 / 灌水 / 纯标点
invalid_patterns:
  - "^test$"
  - "^TEST$"
  - "^测试$"
  - "^123+$"
  - "^哈+$"
  - "^呵+$"
  - "^嗯+$"
  - "^哦+$"
  - "^\\.+$"
  - "^。+$"
  - "^…+$"
  - "^\\?+$"
  - "^！+$"
  - "^!+$"


# -----------------------------------------------------------------------------
# 三、Bug 提级正则
#     命中则把 A.Bug 普通级别从 P2 提到 P1。
# -----------------------------------------------------------------------------
bug_uplift_pattern: "(总是|每次|经常|老是|频繁|一直)"


# -----------------------------------------------------------------------------
# 四、阈值
# -----------------------------------------------------------------------------
thresholds:
  emotion_max_len: 8       # 情绪短句长度上限：超过则不再走情绪规则
  question_short_len: 30   # 咨询句无问号时仍可放行的长度上限
  too_short_len: 1         # 长度 <= 该值 直接判 E.无效


# -----------------------------------------------------------------------------
# 五、置信度（rule 命中时写入结果的 confidence）
# -----------------------------------------------------------------------------
confidence:
  empty: 0.95         # 空文本
  too_short: 0.9      # 单字符
  pure_emoji: 0.9     # 纯表情/纯标点
  invalid_kw: 0.9     # 命中 invalid_patterns
  emotion_pos: 0.9    # 短句正向情绪
  emotion_neg: 0.85   # 短句负向情绪
  bug_p0: 0.9         # P0 关键词
  suggest: 0.85       # 建议关键词
  question: 0.8       # 咨询句式
  bug_general: 0.8    # 普通 Bug 关键词
